<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>清欢 · GentleJoy · 人间有味是清欢</title>
<style>
:root{
  --bg:#f5ead2; --card:#faf0dc; --ink:#3e2f1d; --dim:#8a7a5c;
  --gold:#7a5c1e; --seal:#b03a2e; --line:#d8c9a8; --mist:#b8a887; --accent:#a37c34;
}
html[data-theme="dark"]{
  --bg:#10101a; --card:#1a1a28; --ink:#d8d3c8; --dim:#8f8a7d;
  --gold:#e8b45a; --seal:#d05547; --line:#33334a; --mist:#4a4a5e; --accent:#e8b45a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'FangSong','STFangsong','KaiTi','STKaiti',serif;transition:background .5s,color .5s}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 60px}
/* 开屏 */
#splash{position:fixed;inset:0;z-index:300;background:#f5ead6 url(splash.jpg) center/contain no-repeat;animation:splashFade 7s ease forwards}
@keyframes splashFade{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
/* 顶栏 */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hdr .brand{font-size:26px;letter-spacing:8px;color:var(--gold);text-indent:8px;cursor:pointer}
.hdr .brand .en{font-size:13px;letter-spacing:2px;color:var(--dim);margin-left:4px}
.hdr .date{font-size:13px;color:var(--dim);letter-spacing:2px;text-align:right;line-height:1.7}
.hdr .date b{display:block;font-weight:400;font-size:16.5px;color:var(--ink)}
.hdr .btns{display:flex;gap:6px;margin-top:4px;justify-content:flex-end}
.hdr .btns a{font-size:11px;color:var(--dim);text-decoration:none;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:2px 9px;letter-spacing:1px;background:var(--card)}
.hdr .btns a:hover{color:var(--gold);border-color:var(--gold)}
/* 时辰旁白 */
.period{font-size:14px;color:var(--dim);letter-spacing:2px;margin-bottom:14px;text-align:center}
/* 帖子卡 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;position:relative;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.scene{height:120px;border-radius:8px;overflow:hidden;margin-bottom:16px}
.body{display:flex;gap:18px}
.verse{flex:1;display:flex;justify-content:flex-end;gap:8px;padding-right:6px}
.verse .col{display:flex;flex-direction:column;gap:9px;font-size:31px;line-height:1;color:var(--ink)}
.verse .en{font-size:20px;line-height:1.75;color:var(--ink);writing-mode:horizontal-tb;text-align:right;max-width:170px}
.verse .src{writing-mode:vertical-rl;font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:4px}
.verse .src-en{font-size:11px;color:var(--dim);margin-top:6px;text-align:right}
.warm{flex:1.2;font-size:15.5px;line-height:2.1;color:var(--ink)}
.warm .who{color:var(--gold);font-size:13px;letter-spacing:2px}
.warm .bai{margin-top:6px}
.warm .soft{margin-top:12px;font-size:15px;color:var(--accent)}
/* 回应区 */
.reply{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.reply .t{font-size:12px;color:var(--dim);letter-spacing:2px;margin-bottom:8px}
.turn{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.turn .tm{flex-shrink:0;font-size:12px;color:var(--gold);letter-spacing:1px;margin-top:4px;min-width:40px}
.turn.g .tm{color:var(--seal)}
.turn .tt{font-size:15px;line-height:1.95;color:var(--ink);background:var(--bg);border-radius:8px;padding:7px 11px}
.turn.g .tt{background:transparent;border:1px dashed var(--line)}
.reply .row{display:flex;gap:8px;align-items:center;margin-top:12px}
.reply input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:16px;padding:7px 0;outline:none}
.reply input:focus{border-color:var(--gold)}
.reply .go{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:20px;padding:5px 16px;font-family:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;flex-shrink:0}
.reply .go:hover{background:var(--gold);color:#fff}
.reply .go:disabled{opacity:.35;cursor:default}
.reply .hint{font-size:12.5px;color:var(--dim);margin-top:6px;letter-spacing:1px}
.reply .end{font-size:14.5px;color:var(--gold);margin-top:10px;line-height:1.9}
/* 药柜/集帖册 */
.yao-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:20px;padding:6px 14px;font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
/* 说明 modal */
#modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:420px;width:100%;padding:24px 22px;max-height:80vh;overflow:auto}
#modal h3{font-size:18px;letter-spacing:6px;color:var(--gold);margin-bottom:12px}
#modal p{font-size:14.5px;line-height:2.05;color:var(--ink);margin-bottom:8px}
#modal .close{display:block;margin:14px auto 0;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:20px;padding:6px 28px;font-family:inherit;font-size:13px;letter-spacing:3px;cursor:pointer}
/* 底部 */
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:2px;line-height:2}
.foot a{color:var(--gold);text-decoration:none}
@media(max-width:480px){.body{flex-direction:column}.verse{justify-content:flex-start}.verse .col{flex-direction:row}.verse .src{writing-mode:horizontal-tb}}
</style>
</head>

<script>
/* ============ 内容库（构建时注入） ============ */
/* 清欢 · 古籍日签内容库（80 条，四季各 20，中英双语） */
const POSTS = [
/* ---- 春 ---- */
{text:"春眠不觉晓，处处闻啼鸟",who:"孟浩然",src:"春晓",bai:"春天睡到自然醒，窗外到处是鸟叫。",soft:"古人也赖床。所以偶尔起晚一点，不必有愧——你只是在过春晓。",season:"春",
 en_text:"Spring sleep knows no dawn — birdsong everywhere.",en_who:"Meng Haoran",en_src:"Spring Dawn",en_bai:"Waking naturally in spring, birds singing all around.",en_soft:"The ancients slept in too. Rising late now and then is no shame — you are simply living a spring dawn."},
{text:"胜日寻芳泗水滨，无边光景一时新",who:"朱熹",src:"春日",bai:"好天气出去走走，眼前全是新绿。",soft:"如果今天不想出门，也没关系。春天不会因为你没看见就少开一朵。",season:"春",
 en_text:"On a fine day I seek spring by the river — boundless scenes, all new at once.",en_who:"Zhu Xi",en_src:"Spring Day",en_bai:"Walking out on a fine day, everything fresh and green.",en_soft:"If you do not feel like going out, that is fine too. Spring will not bloom one petal less for being unseen."},
{text:"随风潜入夜，润物细无声",who:"杜甫",src:"春夜喜雨",bai:"雨趁夜里悄悄来，滋润万物，不声不响。",soft:"好的影响都无声。你受过的滋养、给过的温柔，大多也这样——不声不响，但都算数。",season:"春",
 en_text:"Riding the wind it steals into the night, moistening all things without a sound.",en_who:"Du Fu",en_src:"Joyful Rain on a Spring Night",en_bai:"Rain comes quietly in the night, nourishing everything silently.",en_soft:"Good influences are silent. The care you received, the gentleness you gave — most of it works this way: quiet, but it all counts."},
{text:"春色满园关不住，一枝红杏出墙来",who:"叶绍翁",src:"游园不值",bai:"想进园子没门路，一抬头，一枝杏花探出墙头。",soft:"有些美好拦不住，也藏不住。你身上的那点光也一样。",season:"春",
 en_text:"Spring in the garden cannot be shut in — a branch of apricot reaches over the wall.",en_who:"Ye Shaoweng",en_src:"A Failed Visit to the Garden",en_bai:"The garden gate is closed, but a branch of apricot blossoms leans over the wall.",en_soft:"Some beauty cannot be fenced in or hidden. The little light in you is the same."},
{text:"竹外桃花三两枝，春江水暖鸭先知",who:"苏轼",src:"惠崇春江晚景",bai:"竹林外桃花开了几枝，鸭子最先知道江水暖了。",soft:"不必事事争先——第一个知道水暖的，往往是那个先下水的人。晚一点，也行。",season:"春",
 en_text:"A few peach branches beyond the bamboo; the ducks first know the spring river is warm.",en_who:"Su Shi",en_src:"Evening Scene on the Spring River",en_bai:"Peach blossoms by the bamboo; the ducks are the first to feel the warm water.",en_soft:"You need not be first at everything — the one who knows the water is warm is usually the one who stepped in. A little later is fine too."},
{text:"好雨知时节，当春乃发生",who:"杜甫",src:"春夜喜雨",bai:"雨懂得挑时候，该来的时候就来。",soft:"你也一样。不必永远在场，在对的时候出现，就是好雨。",season:"春",
 en_text:"The good rain knows its season — it comes when spring calls.",en_who:"Du Fu",en_src:"Joyful Rain on a Spring Night",en_bai:"The rain knows when to come.",en_soft:"So do you. You need not always be present — appearing at the right moment is rain enough."},
{text:"迟日江山丽，春风花草香",who:"杜甫",src:"绝句",bai:"春日的江山明丽，风里都是花草的香。",soft:"如果闻不到花香，可能是今天风没往这边吹，也可能是你太忙了。停下来三十秒，闻一闻。",season:"春",
 en_text:"Long days, lovely rivers and hills; spring wind carries the scent of grass and blooms.",en_who:"Du Fu",en_src:"Quatrain",en_bai:"Bright spring landscape, fragrant wind.",en_soft:"If you cannot smell the flowers today, maybe the wind is blowing elsewhere — or you are simply too busy. Stop for thirty seconds and breathe in."},
{text:"儿童散学归来早，忙趁东风放纸鸢",who:"高鼎",src:"村居",bai:"孩子放学早，赶着东风去放风筝。",soft:"大人放不了风筝，但可以看天。今晚下班，抬头看看，说不定也有风筝替你飞着。",season:"春",
 en_text:"Children home early from school, hurrying to fly kites in the east wind.",en_who:"Gao Ding",en_src:"Village Life",en_bai:"Children rush out after school to fly kites.",en_soft:"Adults cannot fly kites, but they can look up. On your way home tonight, glance at the sky — maybe a kite is flying for you."},
{text:"渭城朝雨浥轻尘，客舍青青柳色新",who:"王维",src:"送元二使安西",bai:"清晨的雨打湿了尘土，客舍边的柳树格外青翠。",soft:"送别是古人的日常，也是你的日常。柳色年年新，人走了还会再见。",season:"春",
 en_text:"Morning rain dampens the dust of Weicheng; the willows by the inn shine fresh and green.",en_who:"Wang Wei",en_src:"Seeing off Yuan Er to Anxi",en_bai:"Morning rain settles the dust; the willows are fresh.",en_soft:"Farewell was daily life for the ancients, and it is yours too. Willows turn green every year; people part, and meet again."},
{text:"夜来风雨声，花落知多少",who:"孟浩然",src:"春晓",bai:"一夜风雨，不知落了多少花。",soft:"落花不必数。该落的落，该开的开，春天自己会安排。",season:"春",
 en_text:"Wind and rain in the night — who knows how many blossoms fell.",en_who:"Meng Haoran",en_src:"Spring Dawn",en_bai:"A night of wind and rain; petals scattered everywhere.",en_soft:"No need to count the fallen petals. What falls falls, what opens opens — spring arranges itself."},
/* ---- 夏 ---- */
{text:"接天莲叶无穷碧，映日荷花别样红",who:"杨万里",src:"晓出净慈寺送林子方",bai:"莲叶铺到天边，荷花在日光下红得格外好看。",soft:"夏天最热的时候，也是荷花最好的时候。你难熬的日子，也可能正在开出东西。",season:"夏",
 en_text:"Lotus leaves stretch green to the sky; lotus flowers glow extra red in the sun.",en_who:"Yang Wanli",en_src:"Morning Farewell at Jingci Temple",en_bai:"Lotus leaves to the horizon, flowers blazing in the sun.",en_soft:"The hottest days of summer are also the lotus's finest hour. Your hardest days may be quietly blooming too."},
{text:"小荷才露尖尖角，早有蜻蜓立上头",who:"杨万里",src:"小池",bai:"荷叶刚露个尖儿，蜻蜓已经立上去了。",soft:"不必等自己长成满池的荷。露出一点尖角，就有人（有蜻蜓）看见你。",season:"夏",
 en_text:"A tiny lotus tip just breaks the water — a dragonfly already rests on it.",en_who:"Yang Wanli",en_src:"The Little Pool",en_bai:"The lotus is barely a bud; a dragonfly has already landed.",en_soft:"You need not wait until you are a full pond of lotus. Show a small tip, and someone (a dragonfly) will see you."},
{text:"绿树阴浓夏日长，楼台倒影入池塘",who:"高骈",src:"山亭夏日",bai:"树荫浓密，夏日悠长，楼台的影子落在池塘里。",soft:"夏天的长，是拿来浪费的。午睡、发呆、看云，都算正经事。",season:"夏",
 en_text:"Deep green shade, a long summer day; the pavilion's reflection rests in the pond.",en_who:"Gao Pian",en_src:"Summer in the Mountain Pavilion",en_bai:"Thick shade, long days, reflections in the water.",en_soft:"Summer's length is meant to be wasted. Naps, daydreaming, watching clouds — all serious business."},
{text:"稻花香里说丰年，听取蛙声一片",who:"辛弃疾",src:"西江月·夜行黄沙道中",bai:"稻花飘香，蛙声一片，都在说今年收成好。",soft:"听听青蛙，它们比你会庆祝。你今晚也为自己今天的'小丰收'，蛙声一下。",season:"夏",
 en_text:"Amid rice-flower scent they talk of a good year; a chorus of frogs agrees.",en_who:"Xin Qiji",en_src:"Moon over the West River",en_bai:"Fragrant rice fields and frog song promise a harvest.",en_soft:"Listen to the frogs — they celebrate better than you do. Tonight, croak once for your own small harvest."},
{text:"黄梅时节家家雨，青草池塘处处蛙",who:"赵师秀",src:"约客",bai:"梅雨季家家落雨，青草池塘处处蛙鸣。",soft:"约了客人没来，一个人听雨听蛙，也算过了个不错的夜。独处不等于冷清。",season:"夏",
 en_text:"Plum-rain season, rain at every door; frogs croak by every grassy pond.",en_who:"Zhao Shixiu",en_src:"Waiting for a Guest",en_bai:"Rainy season, frog song everywhere.",en_soft:"The guest never came, yet one night of rain and frogs is still a good night. Being alone is not the same as being lonely."},
{text:"泉眼无声惜细流，树阴照水爱晴柔",who:"杨万里",src:"小池",bai:"泉眼细细地流，树影爱怜地照在水上。",soft:"小到一眼泉，也值得被好好对待。你也是。",season:"夏",
 en_text:"The spring outlet cherishes its thin stream in silence; the tree shade loves the gentle water.",en_who:"Yang Wanli",en_src:"The Little Pool",en_bai:"A tiny spring, a tender shade on the water.",en_soft:"Even a single spring deserves to be treated gently. So do you."},
{text:"锄禾日当午，汗滴禾下土",who:"李绅",src:"悯农",bai:"正午锄地，汗滴进土里。",soft:"每一口饭都有人流过汗，你今天的每一分辛苦也都有意义——即使暂时看不见收成。",season:"夏",
 en_text:"Hoeing grain at noon, sweat dripping into the soil.",en_who:"Li Shen",en_src:"Compassion for the Farmers",en_bai:"Midday hoeing, sweat into the earth.",en_soft:"Every grain of rice cost someone sweat. So does your effort today — meaningful even when the harvest is not yet visible."},
{text:"黑云翻墨未遮山，白雨跳珠乱入船",who:"苏轼",src:"六月二十七日望湖楼醉书",bai:"乌云压过来，雨点像珠子跳进船里。",soft:"夏天的暴雨来得急去得快。情绪也是。等它过去，天还是那片天。",season:"夏",
 en_text:"Ink-black clouds roll but do not hide the hills; white rain like pearls leaps into the boat.",en_who:"Su Shi",en_src:"Written Drunk at Wanghu Tower",en_bai:"Storm clouds, then rain pelting into the boat.",en_soft:"Summer storms come fast and go fast. So do moods. When it passes, the sky is the same sky."},
{text:"水晶帘动微风起，满架蔷薇一院香",who:"高骈",src:"山亭夏日",bai:"微风掀起水晶帘，一院子都是蔷薇香。",soft:"夏天也有温柔的瞬间：一阵风、一架花、一院子的香。你今天也留意一个。",season:"夏",
 en_text:"A breeze stirs the crystal curtain; the whole courtyard fills with roses' scent.",en_who:"Gao Pian",en_src:"Summer in the Mountain Pavilion",en_bai:"A breeze, a trellis of roses, a courtyard of fragrance.",en_soft:"Summer has its gentle moments too: a breeze, a vine, a yard of scent. Notice one today."},
{text:"树阴满地日当午，梦觉流莺时一声",who:"苏舜钦",src:"夏意",bai:"正午树荫满地，午睡醒来，偶尔一声莺啼。",soft:"午睡是古人的奢侈，也是你的权利。醒来听到鸟叫，今天就算没白过。",season:"夏",
 en_text:"Shade fills the ground at noon; waking from a nap, an oriole calls now and then.",en_who:"Su Shunqin",en_src:"Summer Feeling",en_bai:"A noon nap under full shade, an oriole's call on waking.",en_soft:"The afternoon nap was the ancients' luxury and is your right too. If you wake to a bird's call, the day was not wasted."},
/* ---- 秋 ---- */
{text:"自古逢秋悲寂寥，我言秋日胜春朝",who:"刘禹锡",src:"秋词",bai:"都说秋天让人悲，我偏说秋天比春天好。",soft:"刘禹锡被贬到朗州，还能说秋天好。你不必学他的嘴硬，但可以学他的：换个角度看，秋天也有秋天好。",season:"秋",
 en_text:"Since old times autumn brings sorrow — I say autumn outshines spring.",en_who:"Liu Yuxi",en_src:"On Autumn",en_bai:"Everyone grieves in autumn; I say autumn is better than spring.",en_soft:"Liu Yuxi, exiled to a far corner, still praised autumn. You need not copy his bravado, but you can borrow his trick: look again — autumn has its own good."},
{text:"停车坐爱枫林晚，霜叶红于二月花",who:"杜牧",src:"山行",bai:"停下车来，因为太爱这片枫林——霜打的叶子比春天的花还红。",soft:"为一片枫林停车，是古人最浪漫的'浪费时间'。你也值得为点什么，停一停。",season:"秋",
 en_text:"I stop the carriage, loving the maple woods at dusk — frosted leaves redder than spring flowers.",en_who:"Du Mu",en_src:"Journey in the Mountains",en_bai:"Stopping the carriage for a maple grove in the evening light.",en_soft:"Stopping for a maple grove is the ancients' most romantic waste of time. You too deserve to stop — for something."},
{text:"空山新雨后，天气晚来秋",who:"王维",src:"山居秋暝",bai:"空山雨后，傍晚已带秋意。",soft:"山里的秋天是慢慢来的。你的变化也可以慢慢来，不必一夜之间。",season:"秋",
 en_text:"After fresh rain on the empty hills, evening air turns to autumn.",en_who:"Wang Wei",en_src:"Autumn Evening in the Mountains",en_bai:"Rain-washed hills, evening with a touch of autumn.",en_soft:"Autumn comes slowly to the mountains. Your changes can come slowly too — no need for overnight."},
{text:"采菊东篱下，悠然见南山",who:"陶渊明",src:"饮酒",bai:"东篱下采菊，一抬头，南山就在那里。",soft:"陶渊明没急着找南山，南山自己出现在他抬头的地方。你要找的东西，多半也在你不急的时候出现。",season:"秋",
 en_text:"Picking chrysanthemums by the eastern fence, I gaze at the southern hills at ease.",en_who:"Tao Yuanming",en_src:"Drinking Wine",en_bai:"Gathering chrysanthemums, looking up to see the southern hills.",en_soft:"Tao never chased the hills; they appeared where he happened to look. What you seek will likely appear when you stop rushing."},
{text:"月落乌啼霜满天，江枫渔火对愁眠",who:"张继",src:"枫桥夜泊",bai:"月落、乌啼、霜满天的夜里，对着江枫渔火，睡不着的旅人。",soft:"一千二百年前有个人跟你一样失眠。他睡不着，写下这首诗；你睡不着，至少还有这诗陪你。",season:"秋",
 en_text:"Moon down, crows cry, frost fills the sky; maple and fishermen's lights face a sleepless traveler.",en_who:"Zhang Ji",en_src:"Mooring by Maple Bridge at Night",en_bai:"A sleepless traveler by the river on a frosty night.",en_soft:"Twelve hundred years ago someone could not sleep, just like you. He wrote this poem. Tonight, if you cannot sleep, at least this poem keeps you company."},
{text:"露从今夜白，月是故乡明",who:"杜甫",src:"月夜忆舍弟",bai:"今夜起露水发白，月亮还是故乡的最亮。",soft:"想家不丢人，古人想家想到写诗。给家里打个电话吧，哪怕只问一句吃了吗。",season:"秋",
 en_text:"White dew falls from this night on; the moon is brightest over home.",en_who:"Du Fu",en_src:"Remembering My Brother on a Moonlit Night",en_bai:"Dew turns white tonight; the home moon is always brightest.",en_soft:"Homesickness is nothing to be ashamed of — the ancients wrote poems about it. Call home tonight, even just to ask if they have eaten."},
{text:"一年好景君须记，最是橙黄橘绿时",who:"苏轼",src:"赠刘景文",bai:"一年里最好的光景，是橙黄橘绿的时候。",soft:"苏轼写这诗是劝朋友别泄气：荷花谢了，可橙子橘子正当时。你的'当时'，可能还没到，也可能就是现在。",season:"秋",
 en_text:"Remember the finest season of the year: when oranges are gold and tangerines green.",en_who:"Su Shi",en_src:"To Liu Jingwen",en_bai:"The best view of the year: ripe oranges in gold and green.",en_soft:"Su Shi wrote this to cheer a friend: the lotus is gone, but the oranges are in season. Your season may not have come — or it may be exactly now."},
{text:"银烛秋光冷画屏，轻罗小扇扑流萤",who:"杜牧",src:"秋夕",bai:"秋夜烛光淡淡，少女用团扇扑着萤火虫。",soft:"古人的夜晚靠萤火虫照亮乐趣。你的夜晚，可以靠一集剧、一首歌、一次散步。",season:"秋",
 en_text:"Silver candlelight chills the painted screen; a small silk fan chases fireflies.",en_who:"Du Mu",en_src:"An Autumn Night",en_bai:"A quiet autumn evening, chasing fireflies with a fan.",en_soft:"The ancients lit their evenings with fireflies. Yours can be lit by an episode, a song, a walk."},
{text:"萧萧梧叶送寒声，江上秋风动客情",who:"叶绍翁",src:"夜书所见",bai:"梧桐叶响送寒声，江上的秋风撩动旅人的心。",soft:"风一吹，叶子就落；心一动，人就念旧。秋天适合想一些人，不必见面。",season:"秋",
 en_text:"Rustling parasol leaves carry the chill; autumn wind on the river stirs a traveler's heart.",en_who:"Ye Shaoweng",en_src:"What I See at Night",en_bai:"Wind in the leaves, a traveler's restless heart.",en_soft:"When the wind blows, leaves fall; when the heart stirs, we remember. Autumn is a fine season for thinking of people — no meeting required."},
{text:"秋水共长天一色",who:"王勃",src:"滕王阁序",bai:"秋天的水与远天连成一片颜色。",soft:"水天相接的时候，人会觉得自己的烦恼很小——小到天和水都装得下。",season:"秋",
 en_text:"Autumn water and the far sky share one color.",en_who:"Wang Bo",en_src:"Preface to the Pavilion of Prince Teng",en_bai:"The river and the sky blend into one.",en_soft:"When water meets sky, your worries look small — small enough that both sky and water can hold them."},
/* ---- 冬 ---- */
{text:"晚来天欲雪，能饮一杯无",who:"白居易",src:"问刘十九",bai:"天快黑了，像要下雪，我这儿温着酒——你来不来？",soft:"没说忙，没说改天。一千二百年后读到这句，还是觉得：有个随时能问'来吗'的人，真好。",season:"冬",
 en_text:"It looks like snow at dusk — can you come for a cup of wine?",en_who:"Bai Juyi",en_src:"A Question to Liu the Nineteenth",en_bai:"Dusk, snow coming; the wine is warm — will you come?",en_soft:"No 'I'm busy,' no 'some other day.' Twelve hundred years later, this line still feels like: how good to have someone you can always ask, 'coming?'"},
{text:"孤舟蓑笠翁，独钓寒江雪",who:"柳宗元",src:"江雪",bai:"大雪封江，一个老翁独自在孤舟上垂钓。",soft:"柳宗元写这诗时被贬永州，心里全是雪。但他笔下的钓翁，还是稳稳地坐着。孤独不可怕，可怕的是慌张。",season:"冬",
 en_text:"A lone boat, a straw-cloaked old man, fishing alone in the river snow.",en_who:"Liu Zongyuan",en_src:"River Snow",en_bai:"Snowbound river, one old man fishing alone.",en_soft:"Liu wrote this while exiled to Yongzhou, his heart full of snow. Yet his fisherman sits steady. Loneliness is not frightening — panic is."},
{text:"墙角数枝梅，凌寒独自开",who:"王安石",src:"梅花",bai:"墙角几枝梅，迎着严寒独自开。",soft:"不必开在显眼处。墙角的梅花，照样有人看见，有人记了一千年。",season:"冬",
 en_text:"A few plum branches by the wall, blooming alone against the cold.",en_who:"Wang Anshi",en_src:"The Plum Blossom",en_bai:"Plum blossoms by the wall, opening in the frost.",en_soft:"You need not bloom where everyone looks. The plum by the wall was seen anyway — and remembered for a thousand years."},
{text:"柴门闻犬吠，风雪夜归人",who:"刘长卿",src:"逢雪宿芙蓉山主人",bai:"柴门外犬吠响起——风雪夜，有人回来了。",soft:"'夜归人'三个字最暖：无论多晚多冷，总有人在等，或者总有一个门可以敲。",season:"冬",
 en_text:"A dog barks at the brushwood gate — through wind and snow, someone returns.",en_who:"Liu Changqing",en_src:"Lodging at Hibiscus Mountain in Snow",en_bai:"Barking at the gate: someone coming home through the snow.",en_soft:"The words 'one returning at night' are the warmest there are: no matter how late or cold, someone is waiting — or there is a door you may knock on."},
{text:"绿蚁新醅酒，红泥小火炉",who:"白居易",src:"问刘十九",bai:"新酿的酒泛着绿沫，红泥小火炉烧得正旺。",soft:"冬天最好的事：一炉火，一壶酒，一个等来的人。今天没有也没关系，火可以先为自己烧。",season:"冬",
 en_text:"Newly brewed wine with green foam; a little red-clay stove glowing.",en_who:"Bai Juyi",en_src:"A Question to Liu the Nineteenth",en_bai:"Fresh wine, a small warm stove.",en_soft:"The best things in winter: a fire, a pot of wine, a person who comes. If there is none today, that is all right — light the fire for yourself first."},
{text:"千山鸟飞绝，万径人踪灭",who:"柳宗元",src:"江雪",bai:"千山不见鸟，万径不见人。",soft:"极静的时候，天地只剩自己。这未必是坏事——人声鼎沸听不见自己，万径人灭时，反而听得清。",season:"冬",
 en_text:"A thousand hills, no birds; ten thousand paths, no footprints.",en_who:"Liu Zongyuan",en_src:"River Snow",en_bai:"No birds in the hills, no footprints on the paths.",en_soft:"In utter stillness, only you and the world remain. That is not necessarily bad — in the din you cannot hear yourself; when every path is empty, you finally can."},
{text:"邯郸驿里逢冬至，抱膝灯前影伴身",who:"白居易",src:"邯郸冬至夜思家",bai:"冬至夜一个人在驿站，抱着膝，只有灯前的影子陪着。",soft:"白居易冬至夜想家，抱膝枯坐。后来他一生写了几千首诗——原来最孤独的夜，也能长出最暖的文字。",season:"冬",
 en_text:"At Handan inn on winter solstice, hugging my knees before the lamp, my shadow my only companion.",en_who:"Bai Juyi",en_src:"Home Thoughts on Winter Solstice",en_bai:"Alone at an inn on solstice night, only a shadow for company.",en_soft:"Bai Juyi sat alone, homesick, hugging his knees. He later wrote thousands of poems — even the loneliest night can grow the warmest words."},
{text:"隔牖风惊竹，开门雪满山",who:"王维",src:"冬晚对雪忆胡居士家",bai:"隔窗听见风惊竹叶，推门一看，雪已满山。",soft:"有些惊喜，要推开门才知道。今天如果你还没出门，说不定门外正有一山好雪等你。",season:"冬",
 en_text:"Wind startles the bamboo beyond the window; opening the door, snow covers the hills.",en_who:"Wang Wei",en_src:"On Snow at Evening, Thinking of Householder Hu",en_bai:"Hearing the bamboo in the wind, opening the door to a snow-covered mountain.",en_soft:"Some surprises only appear when you open the door. If you have not stepped out today, maybe a hill of good snow is waiting outside yours."},
{text:"北风卷地白草折，胡天八月即飞雪",who:"岑参",src:"白雪歌送武判官归京",bai:"北风卷地，八月就飘雪了。",soft:"岑参在苦寒之地送别朋友，写出来的句子却满天飞花。苦的地方，也能开出诗。",season:"冬",
 en_text:"The north wind rolls the earth, white grass snaps; snow flies in the border sky even in the eighth month.",en_who:"Cen Shen",en_src:"Song of White Snow, Seeing off Judge Wu",en_bai:"Bitter wind, early snow in the borderlands.",en_soft:"Cen Shen said farewell in a freezing land — and wrote lines like flying blossoms. Even bitter places can bloom into poetry."},
{text:"寻常一样窗前月，才有梅花便不同",who:"杜耒",src:"寒夜",bai:"一样的窗前月，只因有了梅花，便大不一样。",soft:"日子大多寻常，但一两个'梅花'就够：一杯热茶、一通电话、一句'在吗'。你今天的梅花是什么？",season:"冬",
 en_text:"The same moon at the window — but with plum blossoms, everything is different.",en_who:"Du Lei",en_src:"Cold Night",en_bai:"An ordinary moon, transformed by plum blossoms.",en_soft:"Most days are ordinary, but one or two 'plum blossoms' are enough: a hot cup of tea, a phone call, a simple 'you there?' What is your plum blossom today?"},
/* ---- 春（二） ---- */
{text:"天街小雨润如酥，草色遥看近却无",who:"韩愈",src:"早春呈水部张十八员外",bai:"小雨润如酥油，远远看去草色一片，走近反而看不真切。",soft:"有些希望就是这样：远远看着满心欢喜，凑近了反而模糊。别急，它正在土里长。",season:"春",
 en_text:"The street rain falls like butter; grass is a haze from afar, nothing up close.",en_who:"Han Yu",en_src:"Early Spring, Sent to Secretariat Zhang",en_bai:"Fine rain, distant grass barely visible.",en_soft:"Some hopes are like that: lovely from afar, blurry up close. Be patient — it is still growing underground."},
{text:"碧玉妆成一树高，万条垂下绿丝绦",who:"贺知章",src:"咏柳",bai:"柳树像碧玉妆成，千万条柳丝垂下来。",soft:"一棵柳树也认真打扮自己。你出门前那五分钟，不算浪费时间。",season:"春",
 en_text:"A tree dressed in jasper, ten thousand strands of green silk hanging down.",en_who:"He Zhizhang",en_src:"The Willow",en_bai:"A willow like carved jade, strands swaying.",en_soft:"Even a willow takes time to dress itself. Those five minutes before you step out are not wasted."},
{text:"几处早莺争暖树，谁家新燕啄春泥",who:"白居易",src:"钱塘湖春行",bai:"早莺争着找暖和的树，新燕在衔泥筑巢。",soft:"春天忙的人很多：鸟忙、燕忙，你也忙。忙里记得抬头，看它们一眼，也算过了春。",season:"春",
 en_text:"Early orioles vie for warm trees; new swallows peck spring mud.",en_who:"Bai Juyi",en_src:"Spring Stroll on Qiantang Lake",en_bai:"Birds claiming warm branches, swallows building nests.",en_soft:"Spring is busy: birds busy, swallows busy, you busy too. In the middle of it all, look up once — that counts as having had spring."},
{text:"春潮带雨晚来急，野渡无人舟自横",who:"韦应物",src:"滁州西涧",bai:"傍晚春潮带雨来得急，野渡口没人，小舟自己横在水上。",soft:"没人管的小舟，反而最自在。有时候不被安排，就是最好的安排。",season:"春",
 en_text:"The spring tide runs swift with evening rain; the ferry is empty, the boat adrift.",en_who:"Wei Yingwu",en_src:"On the West Stream of Chuzhou",en_bai:"Rain, swift tide, an unmanned boat drifting.",en_soft:"The boat nobody steers is the freest of all. Sometimes not being scheduled is the best schedule."},
{text:"春风又绿江南岸，明月何时照我还",who:"王安石",src:"泊船瓜洲",bai:"春风又把江南吹绿了，明月什么时候照我回家。",soft:"春来春去不等人，归期却总可以等。想家不是软弱，是心里有个方向。",season:"春",
 en_text:"Spring wind greens the southern shore again — when will the moon carry me home?",en_who:"Wang Anshi",en_src:"Mooring at Guazhou",en_bai:"The south turns green again; home still far.",en_soft:"Spring comes and goes without waiting, but home can always be waited for. Missing home is not weakness — it means you have a direction in your heart."},
{text:"沾衣欲湿杏花雨，吹面不寒杨柳风",who:"志南",src:"绝句",bai:"杏花雨沾衣欲湿，杨柳风吹面不寒。",soft:"春天最好的时刻往往不用刻意找：一阵风、一点雨，刚好路过你。",season:"春",
 en_text:"Apricot rain threatens to wet the robe; willow wind touches the face, not cold.",en_who:"Zhinan",en_src:"Quatrain",en_bai:"Light rain, gentle wind.",en_soft:"Spring's best moments rarely need hunting: a gust of wind, a drop of rain, just passing by you."},
{text:"泥融飞燕子，沙暖睡鸳鸯",who:"杜甫",src:"绝句二首",bai:"春泥松软燕子飞，沙洲暖和鸳鸯眠。",soft:"有人忙着飞，有人躺着睡——春天两种活法都对。今天你是燕子还是鸳鸯？",season:"春",
 en_text:"Swallows fly over thawing mud; mandarin ducks sleep on warm sand.",en_who:"Du Fu",en_src:"Two Quatrains",en_bai:"Busy swallows, resting ducks.",en_soft:"Some fly, some sleep — both are right ways to live a spring. Today, are you the swallow or the duck?"},
{text:"春色恼人眠不得，月移花影上栏杆",who:"王安石",src:"春夜",bai:"春色撩人睡不着，月光把花影送上栏杆。",soft:"睡不着也别硬睡。看看栏杆上的花影，这夜色本来就是给你的。",season:"春",
 en_text:"Spring nights tease sleep away; moonlight moves flower shadows onto the rail.",en_who:"Wang Anshi",en_src:"Spring Night",en_bai:"A sleepless, lovely night.",en_soft:"If sleep will not come, do not force it. Look at the flower shadows on the rail — this night was made for you too."},
{text:"芳树无人花自落，春山一路鸟空啼",who:"李华",src:"春行即兴",bai:"花没人看，自己落了；山路上鸟独自啼。",soft:"没人看见的花也开过，没人听的鸟也唱过。你的努力不必时时被看见，它依然算数。",season:"春",
 en_text:"Blossoms fall unseen in the fragrant trees; birds call alone along the spring hills.",en_who:"Li Hua",en_src:"Impromptu on a Spring Walk",en_bai:"Falling blooms, solitary birdsong.",en_soft:"Unseen flowers still bloom; unheard birds still sing. Your efforts do not need an audience to count."},
{text:"春江潮水连海平，海上明月共潮生",who:"张若虚",src:"春江花月夜",bai:"春江潮水与海齐平，明月随潮一起升起。",soft:"大江大河都在慢慢涨，你急什么。潮会来，月会升，你会好。",season:"春",
 en_text:"The spring river's tide meets the level sea; the bright moon rises with the tide.",en_who:"Zhang Ruoxu",en_src:"Moonlit Night on the Spring River",en_bai:"Tide and moon, rising together.",en_soft:"Even the great river rises slowly. The tide will come, the moon will rise, and so will you."},
/* ---- 夏（二） ---- */
{text:"水光潋滟晴方好，山色空蒙雨亦奇",who:"苏轼",src:"饮湖上初晴后雨",bai:"晴天水光潋滟，雨天山色空蒙，两种都好看。",soft:"晴也好看，雨也好看。你也是——不必只等晴天。",season:"夏",
 en_text:"The water gleams in sun, the hills blur in rain — both are lovely.",en_who:"Su Shi",en_src:"Drinking on Lake West, First Sun Then Rain",en_bai:"Sunny shimmer, rainy haze, both beautiful.",en_soft:"Sunny is beautiful, rainy is beautiful. So are you — no need to wait only for clear days."},
{text:"荷风送香气，竹露滴清响",who:"孟浩然",src:"夏日南亭怀辛大",bai:"荷风送来香气，竹露滴落清响。",soft:"夏天的凉意，一半是风送来的，一半是心静出来的。",season:"夏",
 en_text:"Lotus wind carries fragrance; bamboo dew drips with clear notes.",en_who:"Meng Haoran",en_src:"Summer Evening in the South Pavilion, Thinking of Xin",en_bai:"Fragrant breeze, dripping dew.",en_soft:"Summer's coolness comes half from the wind, half from a settled heart."},
{text:"懒摇白羽扇，裸袒青林中",who:"李白",src:"夏日山中",bai:"懒得摇扇子，敞着衣襟在青林里乘凉。",soft:"夏天可以理直气壮地懒。李白都这样，你怕什么。",season:"夏",
 en_text:"Too lazy to wave the feather fan, robe open in the green woods.",en_who:"Li Bai",en_src:"In the Mountains on a Summer Day",en_bai:"Lazy summer, open robe.",en_soft:"Summer is a fine season to be lazy without apology. Even Li Bai was — so why worry?"},
{text:"梅子金黄杏子肥，麦花雪白菜花稀",who:"范成大",src:"四时田园杂兴",bai:"梅子黄、杏子肥，麦花白、菜花稀。",soft:"田里什么都熟一点。你也在慢慢熟，别催。",season:"夏",
 en_text:"Golden plums, plump apricots; snow-white wheat blooms, thinning rape flowers.",en_who:"Fan Chengda",en_src:"Rural Miscellany in Four Seasons",en_bai:"Everything ripening in the fields.",en_soft:"Everything in the field ripens in its own time. You too — do not rush it."},
{text:"牧童骑黄牛，歌声振林樾",who:"袁枚",src:"所见",bai:"牧童骑着黄牛，歌声在林间回荡。",soft:"小时候的歌是唱给自己听的，长大了就忘了。今天可以再唱一次。",season:"夏",
 en_text:"A herd boy rides his yellow ox, singing loud enough to shake the woods.",en_who:"Yuan Mei",en_src:"What I Saw",en_bai:"A boy, an ox, a song.",en_soft:"As children we sang for ourselves; grown-ups forget how. Today you may sing once more."},
{text:"竹深树密虫鸣处，时有微凉不是风",who:"杨万里",src:"夏夜追凉",bai:"竹林深处虫鸣不断，时有微凉，却并不是风。",soft:"凉意不一定来自风，也可能来自心里的安静。热的时候，先静下来。",season:"夏",
 en_text:"Deep bamboo, thick trees, insects singing; a trace of coolness that is not the wind.",en_who:"Yang Wanli",en_src:"Chasing Coolness on a Summer Night",en_bai:"Coolness without wind.",en_soft:"Coolness does not always come from the wind — sometimes from the calm inside. When it is hot, settle yourself first."},
{text:"一夜雨声凉到梦，万荷叶上送秋来",who:"陈文述",src:"夏日杂诗",bai:"一夜雨声把凉意送进梦里，万叶荷上已见秋意。",soft:"秋天不是突然来的，是雨一夜一夜送来的。改变也一样，润物细无声。",season:"夏",
 en_text:"A night of rain cools the dream; a thousand lotus leaves carry autumn in.",en_who:"Chen Wenshu",en_src:"Miscellaneous Summer Poems",en_bai:"Rain bringing autumn through the night.",en_soft:"Autumn does not arrive suddenly — the rain brings it night by night. Change works the same way, quietly."},
{text:"晴日暖风生麦气，绿阴幽草胜时花",who:"王安石",src:"初夏即事",bai:"晴日暖风麦香起，绿荫下的幽草，胜过热闹的花。",soft:"不抢眼的往往最有后劲。幽草也很好。",season:"夏",
 en_text:"Warm wind on a clear day, wheat in the air; the quiet grass in the shade outshines the gaudy blooms.",en_who:"Wang Anshi",en_src:"Impromptu on Early Summer",en_bai:"Quiet grass, warm fields.",en_soft:"The least flashy things often have the most staying power. Quiet grass is good too."},
{text:"菱透浮萍绿锦池，夏莺千啭弄蔷薇",who:"杜牧",src:"齐安郡后池绝句",bai:"菱叶透出浮萍，绿满池塘；夏莺婉转，蔷薇轻弄。",soft:"夏天热闹但不吵——莺啼、蛙鸣、蝉声，各有各的调。你也在自己的调上。",season:"夏",
 en_text:"Water chestnuts pierce the duckweed, the pond a green brocade; summer orioles trill among the roses.",en_who:"Du Mu",en_src:"Quatrain on the Rear Pond of Qi'an",en_bai:"Green pond, singing birds.",en_soft:"Summer is lively without being loud — orioles, frogs, cicadas, each on its own tune. You are on yours too."},
{text:"竹摇清影罩幽窗，两两时禽噪夕阳",who:"朱淑真",src:"初夏",bai:"竹影摇动罩着幽窗，成对的鸟在夕阳里鸣叫。",soft:"傍晚的鸟叫是下班铃。你也该歇了。",season:"夏",
 en_text:"Bamboo shadows sway over the quiet window; pairs of birds chatter in the setting sun.",en_who:"Zhu Shuzhen",en_src:"Early Summer",en_bai:"Shadows, birds, sunset.",en_soft:"The evening birdsong is the end-of-work bell. You may rest now too."},
/* ---- 秋（二） ---- */
{text:"洛阳城里见秋风，欲作家书意万重",who:"张籍",src:"秋思",bai:"洛阳城里起了秋风，想写家书，心里千头万绪。",soft:"想说的话太多，反而不知从哪句开始。那就从'我挺好的'开始。",season:"秋",
 en_text:"Autumn wind in Luoyang; wanting to write home, thoughts pile up a thousandfold.",en_who:"Zhang Ji",en_src:"Autumn Thoughts",en_bai:"Wind, home, unsent letters.",en_soft:"When there is too much to say, start with 'I am fine.' That is a good beginning."},
{text:"湖光秋月两相和，潭面无风镜未磨",who:"刘禹锡",src:"望洞庭",bai:"湖光秋月相映，无风的潭面像未磨的铜镜。",soft:"秋天不全是萧瑟，也有这样温柔的时刻。你看到的秋，由你决定。",season:"秋",
 en_text:"Lake light and autumn moon blend as one; the windless water like an unpolished mirror.",en_who:"Liu Yuxi",en_src:"Gazing at Lake Dongting",en_bai:"Moon on still water.",en_soft:"Autumn is not all bleak — it has moments this tender. The autumn you see is the one you choose."},
{text:"秋风吹不尽，总是玉关情",who:"李白",src:"子夜吴歌",bai:"秋风吹不尽，心里牵挂的总是远方的人。",soft:"风会停，牵挂不会。有人可牵挂，是秋天的一种暖。",season:"秋",
 en_text:"The autumn wind cannot blow away the longing for those far at the pass.",en_who:"Li Bai",en_src:"Midnight Song of Wu",en_bai:"Unending wind, unending longing.",en_soft:"Wind stops; longing does not. Having someone to miss is a kind of warmth in autumn."},
{text:"落木千山天远大，澄江一道月分明",who:"黄庭坚",src:"登快阁",bai:"落叶满山，天空显得辽阔；江水澄清，月色分明。",soft:"叶子落了，天反而大了。放下一些，视野也会宽一些。",season:"秋",
 en_text:"Leaves fallen over a thousand hills, the sky grows vast; the clear river holds one bright moon.",en_who:"Huang Tingjian",en_src:"Climbing the Quick Pavilion",en_bai:"Bare hills, wide sky, clear moon.",en_soft:"When the leaves fall, the sky widens. Let go of some things, and your view will widen too."},
{text:"树树皆秋色，山山唯落晖",who:"王绩",src:"野望",bai:"每一棵树都染上秋色，每一座山都披着落日余晖。",soft:"黄昏的山最安静。今天也找一处，看一次日落。",season:"秋",
 en_text:"Every tree wears autumn; every hill holds the sunset.",en_who:"Wang Ji",en_src:"Gazing Afield",en_bai:"Trees in autumn, hills in sunset.",en_soft:"Hills at dusk are the quietest of all. Today, find a spot and watch one sunset."},
{text:"秋风萧瑟天气凉，草木摇落露为霜",who:"曹丕",src:"燕歌行",bai:"秋风萧瑟天转凉，草木摇落，露凝成霜。",soft:"草木摇落是为了来年。你的低谷期，也是在给春天腾地方。",season:"秋",
 en_text:"The autumn wind is bleak, the weather cold; plants wither, dew turns to frost.",en_who:"Cao Pi",en_src:"Song of Yan",en_bai:"Withering grass, early frost.",en_soft:"Plants let go to make room for next spring. Your low season is making space for a new one."},
{text:"青山隐隐水迢迢，秋尽江南草未凋",who:"杜牧",src:"寄扬州韩绰判官",bai:"青山隐隐，绿水迢迢，江南秋尽草色未凋。",soft:"江南的秋慢半拍，草还能绿一会儿。你也不必赶秋天的进度。",season:"秋",
 en_text:"Green hills faint, waters stretch far; autumn ends, yet the south's grass has not withered.",en_who:"Du Mu",en_src:"To Han Chuo in Yangzhou",en_bai:"A late, gentle autumn.",en_soft:"The south's autumn runs half a beat slow; the grass stays green a while longer. You need not rush autumn either."},
{text:"落霞与孤鹜齐飞，秋水共长天一色",who:"王勃",src:"滕王阁序",bai:"晚霞与孤鹜同飞，秋水与长天一色。",soft:"再孤单的飞鸟，也有晚霞陪着。你也一样。",season:"秋",
 en_text:"Sunset clouds fly with the lone duck; autumn water meets the sky in one color.",en_who:"Wang Bo",en_src:"Preface to the Pavilion of Prince Teng",en_bai:"Dusk clouds, distant water.",en_soft:"Even the loneliest bird flies with the sunset for company. So do you."},
{text:"秋阴不散霜飞晚，留得枯荷听雨声",who:"李商隐",src:"宿骆氏亭怀远",bai:"秋阴不散霜来得晚，留下枯荷听雨声。",soft:"枯荷不好看，但雨打在上面很好听。人生的难处，也能听出点声音来。",season:"秋",
 en_text:"Autumn gloom lingers, frost comes late; the withered lotus stays to hear the rain.",en_who:"Li Shangyin",en_src:"Lodging at the Luo Family Pavilion",en_bai:"Withered lotus in the rain.",en_soft:"Withered lotus is not pretty, but rain on it sounds wonderful. Even life's hard places can be listened to."},
{text:"万里悲秋常作客，百年多病独登台",who:"杜甫",src:"登高",bai:"万里悲秋常作客，年老多病独自登台。",soft:"杜甫都这么难了，还写得出诗。你今天的难，也配得上被认真对待。",season:"秋",
 en_text:"Far from home in a bleak autumn, sick and old, I climb the terrace alone.",en_who:"Du Fu",en_src:"Climbing High",en_bai:"Lonely autumn, climbing alone.",en_soft:"Even Du Fu, in such hardship, still wrote. Your hard day deserves to be taken seriously too."},
/* ---- 冬（二） ---- */
{text:"旋扑珠帘过粉墙，轻于柳絮重于霜",who:"李商隐",src:"对雪二首",bai:"雪花扑过珠帘、飞过粉墙，比柳絮轻，比霜重。",soft:"雪轻飘飘的，却能压弯竹枝。温柔的东西，也有分量。",season:"冬",
 en_text:"Snow swirls past the pearl curtain over the pale wall — lighter than willow fluff, heavier than frost.",en_who:"Li Shangyin",en_src:"Facing Snow, Two Poems",en_bai:"Light snow, heavy quiet.",en_soft:"Snow floats lightly, yet it can bend bamboo. Gentle things carry weight too."},
{text:"窗含西岭千秋雪，门泊东吴万里船",who:"杜甫",src:"绝句",bai:"窗外是终年不化的西岭雪，门前停着远航万里的船。",soft:"窗里有雪，门外有路。冬天不是终点，是起航前的停留。",season:"冬",
 en_text:"The window frames the west peak's eternal snow; at the door moor ships from ten thousand li away.",en_who:"Du Fu",en_src:"Quatrain",en_bai:"Snow in the window, ships at the door.",en_soft:"Snow at the window, roads beyond the door. Winter is not an ending — it is a rest before sailing."},
{text:"梅须逊雪三分白，雪却输梅一段香",who:"卢梅坡",src:"雪梅",bai:"梅花输雪三分白，雪输梅花一段香。",soft:"不用什么都赢。你有你的香，他有他的白。",season:"冬",
 en_text:"Plum concedes three parts of whiteness to snow; snow yields a breath of fragrance to plum.",en_who:"Lu Meipo",en_src:"Snow and Plum",en_bai:"Snow's whiteness, plum's fragrance.",en_soft:"You need not win everything. You have your fragrance, they have their whiteness."},
{text:"六出飞花入户时，坐看青竹变琼枝",who:"高骈",src:"对雪",bai:"雪花飘进屋里时，坐看青竹变成玉枝。",soft:"雪把平常的竹子变成玉。换个角度，平凡也能发光。",season:"冬",
 en_text:"When the six-petaled snow flies in at the door, the green bamboo turns to jade.",en_who:"Gao Pian",en_src:"Facing the Snow",en_bai:"Snow turning bamboo to jade.",en_soft:"Snow turns ordinary bamboo into jade. Change your angle, and the ordinary can shine."},
{text:"乱山残雪夜，孤烛异乡人",who:"崔涂",src:"巴山道中除夜书怀",bai:"乱山残雪的夜里，一支孤烛照着异乡人。",soft:"异乡的除夕夜，灯再小也是灯。你把自己带到了这里，已经很了不起。",season:"冬",
 en_text:"A night of ragged hills and leftover snow; a lone candle for the traveler in a strange land.",en_who:"Cui Tu",en_src:"Written on New Year's Eve on the Ba Mountain Road",en_bai:"Snow, candle, far from home.",en_soft:"On a stranger's New Year's Eve, even the smallest lamp is still a lamp. You brought yourself this far — that is already remarkable."},
{text:"夜深知雪重，时闻折竹声",who:"白居易",src:"夜雪",bai:"夜里知道雪下得重，不时听到竹子被压断的声音。",soft:"雪很重，竹子断了还会再长。你也断过，你也还在长。",season:"冬",
 en_text:"Deep in the night I know the snow is heavy — now and then a bamboo snaps.",en_who:"Bai Juyi",en_src:"Night Snow",en_bai:"Heavy snow, snapping bamboo.",en_soft:"The snow is heavy; bamboo breaks and grows again. You have broken too — and you are still growing."},
{text:"千里黄云白日曛，北风吹雁雪纷纷",who:"高适",src:"别董大",bai:"黄云蔽日天色昏，北风吹雁雪纷纷。",soft:"送别的时候天不好，但下一句是：莫愁前路无知己。路还长，人还在。",season:"冬",
 en_text:"Yellow clouds dim the day; north wind blows wild geese through falling snow.",en_who:"Gao Shi",en_src:"Farewell to Dong Da",en_bai:"Grey sky, snow, a parting.",en_soft:"The sky was grey when they parted, but the next line was: do not worry, the road ahead has friends. The road is long, and people remain."},
{text:"燕山雪花大如席，片片吹落轩辕台",who:"李白",src:"北风行",bai:"燕山的雪花大如席子，一片片吹落在轩辕台上。",soft:"李白的雪夸张得可爱。你的烦恼，也常被自己放大——它其实没那么大。",season:"冬",
 en_text:"Snowflakes at Yan Mountain big as mats, falling piece by piece on the Xuanyuan Terrace.",en_who:"Li Bai",en_src:"Song of the North Wind",en_bai:"Exaggerated snow, exaggerated worry.",en_soft:"Li Bai's snow was wonderfully exaggerated. So are your worries — they are rarely as big as they seem."},
{text:"冻笔新诗懒写，寒炉美酒时温",who:"李白",src:"立冬",bai:"笔冻了懒得写诗，炉上的美酒时时温热。",soft:"冬天允许偷懒。今天不想努力，就温一杯酒，也算好好过了一天。",season:"冬",
 en_text:"The frozen brush is too lazy for new verse; good wine warms at the cold stove.",en_who:"Li Bai",en_src:"Beginning of Winter",en_bai:"Lazy pen, warm wine.",en_soft:"Winter allows laziness. If you have no energy today, warm a cup of wine — that counts as a well-lived day."},
{text:"千门万户曈曈日，总把新桃换旧符",who:"王安石",src:"元日",bai:"初升的太阳照亮千家万户，家家换上新的桃符。",soft:"旧符总会被新符替换。你也是：旧的篇章翻过，新的正在贴上门。",season:"冬",
 en_text:"A bright sun over ten thousand doors; everyone changes old charms for new.",en_who:"Wang Anshi",en_src:"New Year's Day",en_bai:"New sun, new charms.",en_soft:"Old charms are always replaced by new ones. So it is with you: the old chapter turns, and something new is being posted at your door."},
/* ---- 春（三） ---- */
{text:"春宵一刻值千金，花有清香月有阴",who:"苏轼",src:"春宵",bai:"春夜一刻值千金，花有清香，月有花影。",soft:"千金难买的不是别的，是当下这一刻。你正拥有的今晚，也是千金。",season:"春",
 en_text:"A spring night is worth a thousand gold — flowers have fragrance, the moon has shade.",en_who:"Su Shi",en_src:"Spring Night",en_bai:"A precious spring evening.",en_soft:"What is worth a thousand gold is not something else — it is this very moment. The night you have right now is worth it too."},
{text:"双飞燕子几时回？夹岸桃花蘸水开",who:"徐俯",src:"春游湖",bai:"双飞的燕子几时回来？两岸桃花贴着水面开。",soft:"燕子会回来，花会再开，人也会。别急，都在路上。",season:"春",
 en_text:"When did the twin swallows return? Peach blossoms by both banks lean into the water.",en_who:"Xu Fu",en_src:"Spring Walk by the Lake",en_bai:"Swallows back, blossoms open.",en_soft:"Swallows return, blossoms reopen, people recover too. Do not rush — it is all on its way."},
{text:"草树知春不久归，百般红紫斗芳菲",who:"韩愈",src:"晚春",bai:"草木知道春快走了，争着开出百般红紫。",soft:"春天要走，草木就用力开一场。你也不必怕结束，趁还在，好好活。",season:"春",
 en_text:"Grass and trees know spring is leaving; they vie in reds and purples to bloom.",en_who:"Han Yu",en_src:"Late Spring",en_bai:"Blooms racing before spring ends.",en_soft:"Spring is leaving, so plants bloom with all their might. Do not fear endings either — while you are here, live well."},
{text:"春阴垂野草青青，时有幽花一树明",who:"苏舜钦",src:"淮中晚泊犊头",bai:"春云低垂原野青碧，不时有一树幽花格外明亮。",soft:"阴天里也有亮着的一树花。你灰暗的时候，也别忘了自己身上那点亮。",season:"春",
 en_text:"Spring clouds hang low, fields green; now and then a quiet tree of blossoms glows.",en_who:"Su Shunqin",en_src:"Mooring at Dutou on the Huai River",en_bai:"Grey sky, one bright tree.",en_soft:"Even on a grey day, one tree of blossoms glows. When you feel dim, remember the light in you too."},
{text:"东风夜放花千树，更吹落、星如雨",who:"辛弃疾",src:"青玉案·元夕",bai:"东风一夜吹开千树灯火，如星如雨洒落。",soft:"热闹是别人的，也可以是你的。今夜出门走走，把灯火看进眼里。",season:"春",
 en_text:"The east wind sets ten thousand trees of lanterns blooming, then blows down stars like rain.",en_who:"Xin Qiji",en_src:"Green Jade Table · Lantern Festival",en_bai:"A night of ten thousand lights.",en_soft:"Festivity can be someone else's — or yours. Step out tonight and take the lights into your eyes."},
{text:"春风得意马蹄疾，一日看尽长安花",who:"孟郊",src:"登科后",bai:"春风里马蹄轻快，一天看尽长安的花。",soft:"得意时要记得跑得快，也要记得看花。两样都要。",season:"春",
 en_text:"Triumphant in the spring wind, the horse gallops fast — in one day he sees all the blooms of Chang'an.",en_who:"Meng Jiao",en_src:"After Passing the Examination",en_bai:"Fast horse, full spring.",en_soft:"In triumph, gallop fast — but also remember to look at the blossoms. Keep both."},
{text:"乱花渐欲迷人眼，浅草才能没马蹄",who:"白居易",src:"钱塘湖春行",bai:"繁花渐迷人眼，浅草刚没过马蹄。",soft:"花太多也会看花眼。慢慢走，看一朵是一朵。",season:"春",
 en_text:"Dazzling blossoms blur the eyes; shallow grass barely covers the horse's hooves.",en_who:"Bai Juyi",en_src:"Spring Stroll on Qiantang Lake",en_bai:"Blossoms everywhere, grass underfoot.",en_soft:"Too many flowers can dazzle you. Walk slowly — one bloom at a time is enough."},
{text:"春水碧于天，画船听雨眠",who:"韦庄",src:"菩萨蛮",bai:"春水比天还碧，躺在画船里听雨入睡。",soft:"最好的休息不是什么都不做，是在对的风景里，什么都可以不做。",season:"春",
 en_text:"Spring water is greener than the sky; in a painted boat I sleep to the rain.",en_who:"Wei Zhuang",en_src:"Buddhist Dancers",en_bai:"Sleeping to rain on green water.",en_soft:"The best rest is not doing nothing anywhere — it is being in the right scenery, where doing nothing is enough."},
{text:"燕子来时新社，梨花落后清明",who:"晏殊",src:"破阵子",bai:"燕子来时是春社，梨花落后是清明。",soft:"节令一个接一个，日子一天挨一天。不必赶，你也在节气里。",season:"春",
 en_text:"Swallows come with the spring festival; pear blossoms fall at Qingming.",en_who:"Yan Shu",en_src:"Breaking Formations",en_bai:"Seasons turning gently.",en_soft:"Festivals follow one another, days lean on days. No need to rush — you are inside the seasons too."},
{text:"云淡风轻近午天，傍花随柳过前川",who:"程颢",src:"春日偶成",bai:"云淡风轻近正午，沿着花柳走过河边。",soft:"春天的午间，适合无目的地走。走到哪算哪，也算一日。",season:"春",
 en_text:"Clouds pale, wind soft, near noon; by flowers and willows I pass the stream.",en_who:"Cheng Hao",en_src:"Impromptu on a Spring Day",en_bai:"A gentle walk at noon.",en_soft:"Spring noons are made for wandering without a destination. Wherever you end up counts as a day lived."},
/* ---- 夏（三） ---- */
{text:"乳鸭池塘水浅深，熟梅天气半晴阴",who:"戴复古",src:"初夏游张园",bai:"小鸭在池塘戏水，梅熟时节天气半晴半阴。",soft:"半晴半阴的天气也值得过。你不需要每天都是大晴天。",season:"夏",
 en_text:"Ducklings in the pond, water now deep now shallow; plum-ripe weather, half sun half shade.",en_who:"Dai Fugu",en_src:"Visiting Zhang's Garden in Early Summer",en_bai:"Half sun, half shade.",en_soft:"Half-sunny weather is worth living too. You do not need every day to be a clear sky."},
{text:"风蒲猎猎小池塘，过雨荷花满院香",who:"李重元",src:"忆王孙·夏词",bai:"风过蒲苇猎猎响，雨后的荷花开满院香。",soft:"雨把院子洗过一遍，香气才透出来。你淋过的那些雨，也在替你酝酿香。",season:"夏",
 en_text:"Wind rattles the reeds by the small pond; after rain, lotus fills the yard with fragrance.",en_who:"Li Chongyuan",en_src:"Remembering the Prince · Summer",en_bai:"Rain-washed lotus, full-yard scent.",en_soft:"Rain washes the yard before the fragrance comes through. The rain you have weathered is brewing your scent too."},
{text:"更无柳絮因风起，惟有葵花向日倾",who:"司马光",src:"客中初夏",bai:"没有柳絮随风起，只有葵花朝太阳倾。",soft:"柳絮飘忽，葵花执着。做前者随缘，做后者安心——都好。",season:"夏",
 en_text:"No willow fluff drifts in the wind; only the sunflower leans toward the sun.",en_who:"Sima Guang",en_src:"Early Summer Away from Home",en_bai:"One flower, always facing light.",en_soft:"Willow fluff drifts; the sunflower follows the sun. Drifting is fine, and so is staying steady — both are ways to live."},
{text:"绿荫不减来时路，添得黄鹂四五声",who:"曾几",src:"三衢道中",bai:"绿荫和来时一样浓，还添了几声黄鹂叫。",soft:"同样的路，多几声鸟叫就不一样。日子也是这样，留意一点，就有新声。",season:"夏",
 en_text:"Shade as deep as the way in, plus two or three orioles' songs.",en_who:"Zeng Ji",en_src:"On the Sanqu Road",en_bai:"Same road, new birdsong.",en_soft:"The same road changes with a few extra songs. Days work the same — notice, and you will hear something new."},
{text:"松阴一架半弓苔，偶欲看书又懒开",who:"杨万里",src:"闲居初夏午睡起",bai:"松阴下苔藓半架，想看书又懒得翻开。",soft:"夏天读书，翻两页打个盹，也算读了。别给自己太大负担。",season:"夏",
 en_text:"A rack of pine shade on half a bow of moss; I think of reading, then feel too lazy to open the book.",en_who:"Yang Wanli",en_src:"Waking from a Summer Nap",en_bai:"Reading, then laziness.",en_soft:"In summer, two pages and a nap still counts as reading. Do not burden yourself too much."},
{text:"日长睡起无情思，闲看儿童捉柳花",who:"杨万里",src:"闲居初夏午睡起二绝句",bai:"午睡起来没精神，闲看儿童追捉柳花。",soft:"午睡醒来的发呆时光，是夏天给成年人的小假。发呆不丢人。",season:"夏",
 en_text:"Waking from the long day's nap, no thoughts; idly watching children chase willow fluff.",en_who:"Yang Wanli",en_src:"Two Quatrains after a Summer Nap",en_bai:"A dozy afternoon.",en_soft:"The dazed hour after a summer nap is a small holiday for grown-ups. Daydreaming is not shameful."},
{text:"纷纷红紫已成尘，布谷声中夏令新",who:"陆游",src:"初夏绝句",bai:"春花纷纷落尽成尘，布谷声里夏天到来。",soft:"花落是旧的谢幕，布谷是新日开场。你也不必留恋谢幕。",season:"夏",
 en_text:"The reds and purples have turned to dust; amid cuckoo calls, summer begins anew.",en_who:"Lu You",en_src:"Quatrain on Early Summer",en_bai:"Old blooms fall, new season comes.",en_soft:"Falling blossoms are an old curtain call; the cuckoo opens a new day. You need not cling to what has left."},
{text:"荷花开后西湖好，载酒来时",who:"欧阳修",src:"采桑子",bai:"荷花开后的西湖最好，带着酒来正好。",soft:"有些风景要等到花开后才最好。有些日子，要熬过去才最值得回味。",season:"夏",
 en_text:"West Lake is best after the lotus blooms — come with wine in hand.",en_who:"Ouyang Xiu",en_src:"Picking Mulberries",en_bai:"Lotus season, best time.",en_soft:"Some scenery is best after the blooms open. Some days are best savored after you have lived through them."},
{text:"清风明月无人管，并作南楼一味凉",who:"黄庭坚",src:"鄂州南楼书事",bai:"清风明月没人管，一起化作南楼一味清凉。",soft:"风月免费，凉意免费。这个夏天，先取这两样。",season:"夏",
 en_text:"The cool breeze and bright moon, owned by no one, together become one coolness at the south tower.",en_who:"Huang Tingjian",en_src:"Written at the South Tower of Ezhou",en_bai:"Free wind, free moon, free cool.",en_soft:"Wind and moon cost nothing, and so does coolness. This summer, take those two first."},
{text:"连雨不知春去，一晴方觉夏深",who:"范成大",src:"喜晴",bai:"连日下雨不知春已去，天晴才发现夏已深。",soft:"很多变化都是在不知不觉里完成的。等天晴时你才发觉，原来已经走了这么远。",season:"夏",
 en_text:"Rain after rain, spring left unnoticed; one clear day reveals summer is deep.",en_who:"Fan Chengda",en_src:"Glad for Clear Weather",en_bai:"A clear day after long rain.",en_soft:"Many changes happen without our noticing. When the sky clears, you realize how far you have already come."},
/* ---- 秋（三） ---- */
{text:"秋风起兮白云飞，草木黄落兮雁南归",who:"刘彻",src:"秋风辞",bai:"秋风起白云飞，草木枯黄，大雁南归。",soft:"草木黄落是为了轮回，大雁南归是为了再来。你的低谷也是。",season:"秋",
 en_text:"Autumn wind rises, white clouds fly; plants yellow and fall, wild geese head south.",en_who:"Liu Che",en_src:"Song of the Autumn Wind",en_bai:"Wind, clouds, geese going home.",en_soft:"Plants let go for the cycle; geese fly south to return. Your low season is the same."},
{text:"独上江楼思渺然，月光如水水如天",who:"赵嘏",src:"江楼旧感",bai:"独自登江楼思绪渺远，月光如水，水如天。",soft:"一个人上楼也没关系。月光会陪你站一会儿。",season:"秋",
 en_text:"Alone on the river tower, thoughts drift far; moonlight like water, water like sky.",en_who:"Zhao Gu",en_src:"Old Feelings at the River Tower",en_bai:"Moonlight on water, water on sky.",en_soft:"Going up alone is fine. The moonlight will stand with you for a while."},
{text:"山明水净夜来霜，数树深红出浅黄",who:"刘禹锡",src:"秋词二首",bai:"山明水净夜降霜，几树深红从浅黄里显出来。",soft:"秋天不是只有灰。深红、浅黄、青灰，调在一起才是秋。",season:"秋",
 en_text:"Hills bright, water clear, frost at night; trees of deep red rise from pale yellow.",en_who:"Liu Yuxi",en_src:"Two Autumn Poems",en_bai:"Deep red against pale gold.",en_soft:"Autumn is not only grey. Deep red, pale gold, soft grey — mixed together, that is autumn."},
{text:"欲说还休，却道天凉好个秋",who:"辛弃疾",src:"丑奴儿·书博山道中壁",bai:"想说什么又咽回去，只说了句：天凉好个秋。",soft:"有些话说不出口，就说说天气。天气永远接得住你。",season:"秋",
 en_text:"I want to speak, then stop — and only say: what a cool autumn day.",en_who:"Xin Qiji",en_src:"Ugly Slave · Written on Boshan Road",en_bai:"Words unsaid, weather spoken.",en_soft:"Some things are hard to say — talk about the weather instead. The weather always catches you."},
{text:"秋色渐将晚，霜信报黄花",who:"叶梦得",src:"水调歌头",bai:"秋色渐深，霜降的消息由菊花传来。",soft:"菊花不是秋天里唯一的颜色，但它是按时来的那个。你也按时来就好。",season:"秋",
 en_text:"Autumn colors grow late; frost's news arrives with the yellow blooms.",en_who:"Ye Mengde",en_src:"Water Melody",en_bai:"Frost on the chrysanthemum.",en_soft:"Chrysanthemum is not autumn's only color, but it is the one that arrives on time. Arriving on time is enough for you too."},
{text:"今夜月明人尽望，不知秋思落谁家",who:"王建",src:"十五夜望月",bai:"今夜明月人人仰望，不知秋思落在谁家。",soft:"望月的夜里，想家的人不止你一个。抬头的人，都懂。",season:"秋",
 en_text:"Tonight everyone gazes at the bright moon — no one knows whose home the autumn longing falls on.",en_who:"Wang Jian",en_src:"Gazing at the Moon on the Fifteenth Night",en_bai:"One moon, many longings.",en_soft:"On moonlit nights, you are not the only one missing home. Everyone looking up understands."},
{text:"未觉池塘春草梦，阶前梧叶已秋声",who:"朱熹",src:"劝学诗",bai:"还像在春草梦里，阶前梧桐已响起秋声。",soft:"时间不等人，但也不用怕。春梦秋声，各有各的好。",season:"秋",
 en_text:"Still dreaming of spring grass by the pond; already the parasol leaves sound of autumn at the steps.",en_who:"Zhu Xi",en_src:"Poem Encouraging Study",en_bai:"Spring dream, autumn sound.",en_soft:"Time waits for no one — but do not fear it. Spring dreams and autumn sounds each have their goodness."},
{text:"满载一船秋色，平铺十里湖光",who:"张孝祥",src:"西江月",bai:"一船装满了秋色，湖光平铺十里。",soft:"把秋色装满船，把湖光铺开看。今天也给自己装一船好看的东西。",season:"秋",
 en_text:"A boat loaded with autumn colors; ten li of lake light spread flat.",en_who:"Zhang Xiaoxiang",en_src:"Moon over the West River",en_bai:"A boatful of autumn.",en_soft:"Fill the boat with autumn, spread out the lake light. Today, load yourself with something beautiful too."},
{text:"南山与秋色，气势两相高",who:"杜牧",src:"长安秋望",bai:"南山和秋色，气势一般高。",soft:"秋色是看出来的气势。你抬起头的样子，也是。",season:"秋",
 en_text:"The southern hills and the autumn colors — two heights that match each other.",en_who:"Du Mu",en_src:"Autumn View from Chang'an",en_bai:"Hills and autumn, equal height.",en_soft:"Autumn's grandeur is something you see. The way you lift your head has its own."},
{text:"萧萧远树疏林外，一半秋山带夕阳",who:"寇准",src:"书河上亭壁",bai:"萧萧远树疏林外，一半秋山映着夕阳。",soft:"秋天最好看的时刻，是夕阳染上那一半山。你的黄昏也快到了。",season:"秋",
 en_text:"Beyond the sparse trees rustling far off, half the autumn hills carry the setting sun.",en_who:"Kou Zhun",en_src:"Written on the Pavilion Wall by the River",en_bai:"Half a hillside of sunset.",en_soft:"Autumn's finest hour is the sunset coloring half the mountain. Your dusk is coming too."},
/* ---- 冬（三） ---- */
{text:"岁暮阴阳催短景，天涯霜雪霁寒宵",who:"杜甫",src:"阁夜",bai:"年末白昼渐短，天涯霜雪初晴的寒夜。",soft:"昼短夜长的日子，适合早点收工，暖一暖。",season:"冬",

 en_text:"Bright moon on piled snow; the north wind strong and mournful.",en_who:"Xie Lingyun",en_src:"Year's End",en_bai:"Moon, snow, cold wind.",en_soft:"The moonlight on a cold night is the cleanest thing there is. If sleep will not come, look at the snow and moon once."},
{text:"终南阴岭秀，积雪浮云端",who:"祖咏",src:"终南望余雪",bai:"终南山北岭秀美，积雪好像浮在云端。",soft:"远山上的雪，看着就让人心里安静。找个远方看看吧。",season:"冬",
 en_text:"The shaded ridge of Zhongnan is fair; its snow drifts above the clouds.",en_who:"Zu Yong",en_src:"Gazing at the Remaining Snow on Zhongnan",en_bai:"Snow floating above clouds.",en_soft:"Snow on a distant mountain quiets the heart just by looking. Find yourself a distance to gaze at."},

{text:"风一更，雪一更，聒碎乡心梦不成",who:"纳兰性德",src:"长相思",bai:"风一阵，雪一阵，吵得思乡的心睡不成。",soft:"风雪夜里想家，是人之常情。天亮后打个电话回去，就好了。",season:"冬",
 en_text:"Wind for one watch, snow for one watch, rattling the homesick heart so sleep will not come.",en_who:"Nalan Xingde",en_src:"Everlasting Longing",en_bai:"Wind, snow, homesickness.",en_soft:"Missing home on a snowy night is only human. Call home when day breaks — it will ease."},

 en_text:"Plum petals fall by the steps like confused snow; brushed off, they cover me again.",en_who:"Li Yu",en_src:"Pure Serene Music",en_bai:"Petals that keep falling.",en_soft:"Some things fall like plum petals and cannot be brushed away. Let them fall a while — spring will tidy up."},

"雪":["雪是天地最公道的——落朱门，也落茅檐。你那里若正下雪，温一盏茶看它落：人间冷暖，雪都见过，也都化了。明日晴时，万事如初。","老夫在长安见过初雪，也在岭南见过——雪不择地而落，人亦当不择境而安。今夜有雪，便算我与你共看一回。","晚来天欲雪，能饮一杯无？这句我问了刘十九一千二百年，今日也问君：若不便来，便隔窗与雪对坐，亦是一饮。"],
"雨":["听雨如读书：一夜檐声，半卷闲愁。古人最会听雨——'小楼一夜听春雨'，听的是雨，落的却是心事。你的雨，也在替你说话。","雨总会停的，天总会亮的。古来多少事，都随檐下水流去了。你且等一等，不必急着晴。","春雨贵如油，秋雨易生愁——同是雨，心境不同而已。你此刻听的，是哪一场？"],
"月":["明月几时有？我叹过，君也在叹。但月总是在的——你抬头，它就替你亮着；你不抬头，它也在。","月是古人的灯。张若虚问'江畔何人初见月'，一问千年。你今晚若见月，便算替我又看了一回。","月色入户，欣然起行——此境我写过，最知其中滋味。睡不着便看看月，看倦了自然睡得着。"],
"山":["山不来就我，我便去就山——这话反着说也对：你心里那座过不去的山，走一步近一步，终会到脚下。","悠然见南山，不是找见，是遇见。你心里想要的安定，多半也在你不刻意的时候，自己冒出来。","山高自有客行路，水深自有渡船人。古人行路如此，你行路亦当如此。"],
"水":["上善若水，水善利万物而不争。你不必争——把自己活成水，绕得开石头，流得到海。","逝者如斯夫，不舍昼夜——孔子见水而叹时光，但我更愿你看水的另一面：日夜不舍，所以终到大海。你的日子也一样，一直在往前走。","一池水静，可照天光云影。你心静的时候，也能照见许多平日看不见的东西。"],
"花":["花开堪折直须折，莫待无花空折枝。我劝君：当下一杯茶、一次散步、一句'在吗'，都是堪折的花。","落红不是无情物，化作春泥更护花。谢了也有谢了的用处——你的低谷，未必不是来年的春泥。","花不看开人易老。春天年年有，看花的心要年年新。"],
"酒":["酒逢知己千杯少。我今夜备了一坛，君若有话，便来说与我听；君若无话，共饮一杯也是好的。","古来圣贤皆寂寞，惟有饮者留其名——但小酌怡情，大醉伤身。我劝君：杯中七分，话留三分。","绿蚁新醅酒，红泥小火炉——此境我已备好千年。你那边若有炉火，便算与我围炉同饮。"],
"茶":["茶凉了可再续，话说了收不回——所以挑暖的说，挑真的说。这是老夫活了一辈子的经验。","寒夜客来茶当酒，竹炉汤沸火初红。有茶有火，便不算辜负这一夜。","一盏茶，从烫到温到凉，像极了日子——不必急着喝完，慢慢品。"],
"累":["君言累，我深知之。当年我在惠州躬耕，日落时也觉骨散。然愈累愈要慢：饭要一口口吃，路要一步步走。今日撑不住，便早些歇，天塌不下来。","力尽不知热，但惜夏日长。累了就歇——这世上没有什么，值得你用整夜的失眠去换。","偷得浮生半日闲——你今日的'闲'，可以先从一杯热水、一次深呼吸开始。古人的'闲'，都是这么偷出来的。"],
"忙":["忙是常事，别让它吞了晚饭。陶渊明不为五斗米折腰，你至少可以为自己准点吃饭。","案牍劳形，自古皆然。但'忙'字拆开，是'心亡'——再忙，也记得给心留一盏茶的时间。","忙里偷闲，闲里忙——日子都是这么过来的。你若实在忙，便把这帖看完，也算偷得片刻。"],
"家":["想家就打回去，古人想家写诗，你打一通电话，胜过写诗。家不在远方，在你拨通的那一刻。","露从今夜白，月是故乡明。我在秦州月下写过这句——天下的月都亮，可心上的那轮，永远在故乡。","梦里不知身是客，一晌贪欢。想家不丢人，这是人心里最真的地方。"],
"夜":["夜深了，我劝君莫熬。睡不着便起来点一盏灯，读两行书——灯下只影，也是清欢。张继在枫桥陪过你，今夜换我陪你。","昼短苦夜长，何不秉烛游？睡不着也有睡不着的好：夜色是偷来的时间，只属于你。","夜半钟声到客船——那钟声我听了千年。你若也睡不着，便当这钟声此刻正敲在你窗前。"],
"孤":["独处不是寂寞，是给自己留的院子。陶渊明在东篱，柳宗元在寒江——他们都不孤单，因为他们心里有自己。","众人皆醉我独醒——醒着的孤独，自古有之，你不孤单。","孤舟蓑笠翁，独钓寒江雪。你看，孤独也能很美——美在它诚实。"],
"乐":["此乐难得，记得收好——低谷时翻出来用。古人藏乐，如藏酒，越久越香。","人生得意须尽欢，莫使金樽空对月。你今日之乐，当浮一大白！","哈哈，同乐同乐！乐是可传的——你笑一声，我在这头千年，也听见了。"],
"吃":["民以食为天。好好吃饭，就是好好生活——这是最朴素也最要紧的道理。","一箪食，一瓢饮，回也不改其乐。有饭吃，有茶喝，日子就还过得。","人间烟火气，最抚凡人心。你今晚那碗热饭，就是人间最好的药。"],
"睡":["春眠不觉晓，觉来正好。睡个好觉，是古人最朴素的养生，也是你最该给自己的。","睡足是福。天大的事，睡一觉再说——这话不是逃避，是古人的智慧。","我劝君：今夜早睡，明日的事，明日自有分晓。"],
"病":["病来如山倒，病去如抽丝。慢慢来，身体最要紧——江山是别人的，身子是自己的。","古人云'病去如抽丝'——给自己时间，别急。你好了，什么都来得及。"],
"爱":["问世间情为何物，直教生死相许？古人问过千年，你也不必急着有答案。爱没有答案，只有过程。","情之所钟，正在我辈。能爱、敢爱、还愿意相信爱——这本身就是难得的本事。"]
};

/* ============ 今日帖 ============ */
function todayInfo(){
  const d = new Date();
  const m = d.getMonth() + 1, day = d.getDate();
  const md = m + "-" + day;
  const jq = (JIEQI.find(x => x[1] === md) || [])[0];
  const solar = d.getFullYear() + "年" + m + "月" + day + "日" + (jq ? " · " + jq : "");
  const lunar = LUNAR[md] || "";
  const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return { md, jq, solar, lunar, doy };
}
function periodOf(){
  const h = new Date().getHours();
  if(h < 9) return 0; if(h < 15) return 1; if(h < 20) return 2; return 3;
}
function todayPost(){
  const doy = todayInfo().doy;
  const seasons = ["春","夏","秋","冬"];
  const s = seasons[Math.floor((doy - 45) / 91 + 4) % 4];
  const pool = POSTS.filter(p => p.season === s);
  const list = pool.length ? pool : POSTS;
  return list[doy % list.length];
}

    "秋":["#c9a97a","#d8a060"], "冬":["#aab3c8","#8f9bb8"]
  }[season] || ["#b8a887","#9fb2a8"];
  return `<svg viewBox="0 0 520 120" width="100%" style="display:block">
    <g fill="none" stroke="${pal[0]}" stroke-width="1.4">
      <path d="M0 92 Q60 58 120 84 Q180 108 250 72 Q320 40 380 76 Q450 104 520 68"/>
      <path d="M0 104 Q80 78 160 98 Q240 116 330 92 Q420 70 520 96" opacity=".55"/>
    </g>
    <g fill="${pal[1]}" opacity=".8">
      <circle cx="380" cy="42" r="14"/>
      <path d="M380 30 Q386 18 380 10 Q374 18 380 30" fill="${pal[1]}"/>
    </g>
    ${season==="冬"?'<g fill="#dde6f2"><circle cx="90" cy="40" r="2"/><circle cx="150" cy="28" r="1.6"/><circle cx="230" cy="50" r="1.8"/><circle cx="300" cy="34" r="1.4"/><circle cx="450" cy="44" r="1.7"/></g>':''}
    ${season==="春"?'<g fill="#e8b7b7"><circle cx="70" cy="66" r="2.4"/><circle cx="130" cy="78" r="1.8"/><circle cx="240" cy="88" r="2"/><circle cx="470" cy="82" r="2.2"/></g>':''}
    ${season==="秋"?'<g fill="#d8a060"><circle cx="110" cy="52" r="1.8"/><circle cx="200" cy="44" r="1.5"/><circle cx="420" cy="58" r="2"/></g>':''}
  </svg>`;

function verseHTML(p){
  if(lang === 'en'){
    return `<div class="en">${p.en_text}</div><div class="src-en">${p.en_who} · ${p.en_src}</div>`;
  }
  const lines = [];
  let cur = "";
  for(const c of p.text){
    if(c === "，" || c === "。"){
      cur += c; lines.push(cur); cur = "";
    } else cur += c;
  }
  if(cur) lines.push(cur);
  let html = "";
  for(const ln of lines.reverse()){
    html += `<div class="col">${[...ln].map(c => `<span>${c}</span>`).join("")}</div>`;
  }
  html += `<div class="src">${p.who} ${p.src}</div>`;
  return html;
}
function loadTalk(md){
  try{ const r = JSON.parse(localStorage.getItem('qjTalk') || "{}"); return r[md] || {turns:[]}; }catch(e){ return {turns:[]}; }
}
function saveTalk(md, talk){
  let all = {};
  try{ all = JSON.parse(localStorage.getItem('qjTalk') || "{}"); }catch(e){}
  all[md] = talk;
  try{ localStorage.setItem('qjTalk', JSON.stringify(all)); }catch(e){}
}
function getReply(p, text, round, used){
  used = used || [];
  function pick(list){
    const rest = list.filter(x => used.indexOf(x) < 0);
    if(rest.length) return rest[Math.floor(Math.random() * rest.length)];
    return null; // 池子已耗尽
  }
  for(const kw of Object.keys(THEMES)){
    if(text.indexOf(kw) >= 0){
      const r = pick(THEMES[kw]);
      if(r) return r;
      break; // 主题池耗尽 → 降级人物池
    }
  }
  const rp = pick(REPLIES[p.who] || REPLIES["default"]);
  if(rp) return rp;
  return CLOSERS[Math.floor(Math.random() * CLOSERS.length)];
}
function talkHTML(p, talk, ended){
  let html = "";
  for(const t of talk.turns){
    html += `<div class="turn"><div class="tm">${lang==='zh'?'你':'You'}</div><div class="tt">${t.mine}</div></div>
             <div class="turn g"><div class="tm">${lang==='zh'?p.who:p.en_who}</div><div class="tt">「${t.reply}」</div></div>`;
  }
  if(ended) html += `<div class="end">${lang==='zh'?'—— 夜深，古人已归。明日再来。':'—— the ancient one has retired. Come again tomorrow.'}</div>`;
  return html;
}
function submitReply(){
  const ti = todayInfo();
  const p = todayPost();
  const inp = document.getElementById("replyIn");
  const v = inp.value.trim();
  if(!v){ inp.focus(); return; }
  const talk = loadTalk(ti.md);
  const round = talk.turns.length + 1;
  const used = talk.turns.map(t => t.reply);
  const reply = getReply(p, v, round, used);
  talk.turns.push({ mine: v, reply: reply });
  saveTalk(ti.md, talk);
  render();
  const el = document.getElementById("talkEnd");
  if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

  document.getElementById("period").textContent = t("period")[periodOf()];
  document.getElementById("footTxt").textContent = t("foot");
  const talk = loadTalk(ti.md);
  const turnCount = talk.turns.length;
  const ended = turnCount >= 5;
  document.getElementById("card").innerHTML = `
    <div class="scene">${sceneSVG(p.season)}</div>
    <div class="body">
      <div class="verse">${verseHTML(p)}</div>
      <div class="warm">
        <div class="who">${lang==='zh' ? p.who + " · " + p.src : p.en_who + " · " + p.en_src}</div>
        <div class="bai">${lang==='zh' ? p.bai : p.en_bai}</div>
        <div class="soft">${lang==='zh' ? p.soft : p.en_soft}</div>
      </div>
    </div>
    <div style="text-align:center;margin:12px 0 2px">
      <button class="chip" id="favBtn" onclick="toggleFav(${POSTS.indexOf(p)})">${loadFav().indexOf(POSTS.indexOf(p)) >= 0 ? t("favAdded") : t("favAdd")}</button>
      <button class="chip" onclick="shareCard()">${t("share")}</button>
    </div>
    <div class="reply">
      <div class="t">${t("reply")}${talk.turns.length ? '（' + turnCount + '/5）' : ''}</div>
      <div id="talkEnd">${talkHTML(p, talk, ended)}</div>
      ${ended ? '' : `
      <div class="row">
        <input id="replyIn" placeholder="${lang==='zh' ? '在此回应古人……' : 'reply to the ancient one...'}" maxlength="60">
        <button class="go" onclick="submitReply()">${lang==='zh' ? '发送' : 'Send'}</button>
      </div>
      <div class="hint">${t("hint")}</div>`}
      ${ended ? `<div class="clearRow" style="margin-top:12px;text-align:center">
        <button class="go" id="clearBtn" onclick="clearTalk()">${t("clear")}</button>
      </div>` : ''}
    </div>`;
  const inp = document.getElementById("replyIn");
  if(inp){
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submitReply(); } });
    inp.focus();
  }
}

/* ============ 药柜（按心事取帖） + 集帖册（收藏） ============ */
const THEME_KEYS = ["闲适","温暖","思念","山水","草木","时光","酒茶","孤独","夜晚","励志","疲惫","忙碌","喜悦","静心","归乡","离别"];
const THEME_RULES = [
  ["疲惫", /累|倦|疲|乏|困|懒/],
  ["忙碌", /忙/],
  ["喜悦", /喜|悦|欣/],
  ["静心", /静|禅|清心|听雨|澄/],
  ["归乡", /归|还家|夜归|故里|家书/],
  ["励志", /少年|志|奋|功名|天涯|长风|沧海|何惧|莫愁|破浪/],
  ["离别", /别|送|挥手|远行/],
  ["思念", /思|忆|故人|相思|望月|故乡|念|牵挂/],
  ["酒茶", /酒|杯|茶|饮|醉/],
  ["温暖", /暖|火炉|炉|亲|温|围炉/],
  ["夜晚", /月|星|夜|眠|烛|梦/],
  ["孤独", /孤|独钓|独坐|寂寞|无客|空山/],
  ["山水", /山|水|江|河|溪|舟|湖|海|泉/],
  ["草木", /花|草|柳|杏|桃|梅|荷|菊|松|竹|兰|桂/],
  ["时光", /年|春|秋|雪|日|岁|霜|白发|时光|流年/],
];
function themeOf(p){
  const txt = (p.text + p.bai + p.soft);
  for(const [k, re] of THEME_RULES){
    if(re.test(txt)) return k;
  }
  return "闲适";
}
function loadFav(){ try{ return JSON.parse(localStorage.getItem('qjFav') || "[]"); }catch(e){ return []; } }
function saveFav(list){ try{ localStorage.setItem('qjFav', JSON.stringify(list)); }catch(e){} }
function toggleFav(idx){
  let list = loadFav();
  const i = list.indexOf(idx);
  if(i >= 0){ list.splice(i, 1); } else { list.unshift(idx); }
  saveFav(list);
  const btn = document.getElementById('favBtn');
  if(btn) btn.textContent = (list.indexOf(idx) >= 0) ? t("favAdded") : t("favAdd");
}
let yaoTheme = "全部";
let yaoPost = null;
function renderYao(){
  const themes = t("themes");
  const list = THEME_KEYS;
  let h = `<div class="sec-h" style="margin-bottom:14px"><span class="bar"></span><h2>🌿 ${t("yao")}</h2><span class="bar"></span></div>`;
  h += `<div class="yao-chips">`;
  const chips = ["全部"].concat(list);
  for(let i = 0; i < chips.length; i++){
    const cn = chips[i];
    h += `<button class="chip${cn === yaoTheme ? ' on' : ''}" onclick="pickYao('${cn}')">${cn === '全部' ? t("all") : themes[i]}</button>`;
  }
  h += `</div><div style="height:8px"></div>`;
  const card = document.getElementById("card");
  // 按主题筛帖
  const pool = yaoTheme === "全部" ? POSTS : POSTS.filter(p => themeOf(p) === yaoTheme);
  if(!yaoPost || (yaoTheme !== '全部' && themeOf(yaoPost) !== yaoTheme)){
    yaoPost = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  }
  if(yaoPost){
    const p = yaoPost;
    const idx = POSTS.indexOf(p);
    const fav = loadFav().indexOf(idx) >= 0;
    h += `<div class="card" style="max-width:460px;margin:0 auto">
      <div class="scene" style="height:70px">${sceneSVG(p.season)}</div>
      <div class="body">
        <div class="verse" style="justify-content:center">${verseHTML(p)}</div>
        <div class="warm" style="text-align:center">
          <div class="who">${lang==='zh' ? p.who + " · " + p.src : p.en_who + " · " + p.en_src}</div>
          <div class="bai">${lang==='zh' ? p.bai : p.en_bai}</div>
          <div class="soft">${lang==='zh' ? p.soft : p.en_soft}</div>
        </div>
      </div>
      <div style="text-align:center;margin:14px 0 4px">
        <button class="chip" id="favBtn" onclick="toggleFav(${idx})">${fav ? t("favAdded") : t("favAdd")}</button>
      </div>
      <div style="text-align:center"><span style="font-size:12px;color:var(--dim)">${lang==='zh'?'主题 · ':''}${themes[THEME_KEYS.indexOf(themeOf(p))]} · ${pool.length} ${lang==='zh'?'帖':'posts'}</span></div>
    </div>`;
  } else {
    h += `<p style="text-align:center;color:var(--dim);margin-top:40px">${lang==='zh'?'此主题暂无帖子':'No posts in this theme yet'}</p>`;
  }
  h += `<div style="text-align:center;margin-top:16px"><button class="go" onclick="pickYao('${yaoTheme}')">${t("nextPost")}</button></div>`;

  card.innerHTML = h;
  window.scrollTo({top:0});
}
function pickYao(th){
  yaoTheme = th; yaoPost = null;
  renderYao();
}
function renderFav(){
  const fav = loadFav();
  let h = `<div class="sec-h" style="margin-bottom:14px"><span class="bar"></span><h2>♥ ${t("fav")}</h2><span class="bar"></span></div>`;
  if(!fav.length){
    h += `<p style="text-align:center;color:var(--dim);margin-top:40px;line-height:2">${t("noFav")}</p>`;

        <div class="body">

/* ============ 今日一帖分享卡（canvas） ============ */
function shareCard(){
  const p = todayPost();
  const W = 900, H = 1420;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  // 米黄渐变底
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f7eeda'); g.addColorStop(1, '#f0e0c0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 边框
  ctx.strokeStyle = '#b8914f'; ctx.lineWidth = 5;
  ctx.strokeRect(22, 22, W - 44, H - 44);
  ctx.strokeStyle = '#8a6a35'; ctx.lineWidth = 1;
  ctx.strokeRect(34, 34, W - 68, H - 68);
  ctx.textAlign = 'center';
  // 顶部
  ctx.fillStyle = '#7a5c1e';
  ctx.font = '28px KaiTi,STKaiti,SimSun';
  ctx.fillText('清欢 · GentleJoy · 人间有味是清欢', W / 2, 92);
  // 季节标
  ctx.fillStyle = '#a8864f';
  ctx.font = '24px KaiTi,STKaiti,SimSun';
  ctx.fillText('—— ' + p.season + ' ——', W / 2, 148);
  // 竖排诗句（右侧起单列）
  const chars = p.text.split('');
  ctx.fillStyle = '#3e2f1d';
  ctx.font = '52px KaiTi,STKaiti,SimSun';
  let y = 230;
  for(const ch of chars){
    ctx.fillText(ch, W / 2, y);
    y += 64;
  }
  // 出处
  ctx.fillStyle = '#7a5c1e';
  ctx.font = '26px KaiTi,STKaiti,SimSun';
  ctx.fillText('—— ' + p.who + '《' + p.src + '》', W / 2, y + 30);
  // 白话（换行）
  ctx.fillStyle = '#5a4a2a';
  ctx.font = '24px SimSun,SimHei';
  const wrap = function(txt, maxW){
    const lines = []; let line = '';
    for(const ch of txt){
      if(ctx.measureText(line + ch).width > maxW){ lines.push(line); line = ch; }
      else line += ch;
    }
    if(line) lines.push(line);
    return lines;
  };
  let yy = y + 100;
  for(const ln of wrap(p.bai, 700)){ ctx.fillText(ln, W / 2, yy); yy += 38; }
  // soft 引文（楷体斜体感）
  ctx.fillStyle = '#8a6a35';
  ctx.font = '23px KaiTi,STKaiti,SimSun';
  yy += 18;
  for(const ln of wrap(p.soft, 660)){ ctx.fillText('「' + ln + '」', W / 2, yy); yy += 36; }
  // 底部
  ctx.fillStyle = '#8a6a35';
  ctx.font = '26px SimSun';
  ctx.fillText('永远的兰兰 · Lanlan Eternal', W / 2, H - 120);
  ctx.font = '20px SimSun';
  ctx.fillStyle = '#a08a5f';
  ctx.fillText('podcatcher962.github.io/GentleJoy', W / 2, H - 80);
  const dataUrl = cv.toDataURL('image/png');
  const card = document.getElementById('card');
  card.innerHTML = `<div style="text-align:center">
    <img src="${dataUrl}" style="max-width:100%;border:1px solid var(--line);border-radius:8px" alt="分享卡">
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="go" style="text-decoration:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:7px 22px" download="qinghuan_share.png" href="${dataUrl}">💾 ${t("shareSave")}</a>
      <a class="go" style="text-decoration:none;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:7px 22px" onclick="render()">← ${lang==='zh'?'返回':'Back'}</a>
    </div>
  </div>`;
  window.scrollTo({top:0});
}
function exportFav(){  const fav = loadFav();
  const lines = [];
  for(const idx of fav){
    const p = POSTS[idx];
    if(!p) continue;
    lines.push('「' + p.text + '」—— ' + p.who + '《' + p.src + '》\n' + p.bai + '\n' + p.soft);
  }
  const txt = '清欢 · 我的集帖册\n\n' + lines.join('\n\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ alert(t("copied")); });
  } else {
    const ta = document.createElement('textarea'); ta.value = txt;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    alert(t("copied"));
  }
}

let clearArm = false;
function clearTalk(){
  const ti = todayInfo();
  const p = todayPost();
  const talk = loadTalk(ti.md);
  const btn = document.getElementById("clearBtn");
  if(!clearArm){
    clearArm = true;
    btn.textContent = t("clear2");
    setTimeout(()=>{ clearArm = false; const b = document.getElementById("clearBtn"); if(b) b.textContent = t("clear"); }, 3000);
    return;
  }
  if(talk.turns.length){
    let his = [];
    try{ his = JSON.parse(localStorage.getItem('qjHistory') || "[]"); }catch(e){}
    his.unshift({ date: ti.solar, who: p.who, en_who: p.en_who, turns: talk.turns });
    try{ localStorage.setItem('qjHistory', JSON.stringify(his.slice(0, 30))); }catch(e){}
  }
  try{
    const all = JSON.parse(localStorage.getItem('qjTalk') || "{}");
    delete all[ti.md];
    localStorage.setItem('qjTalk', JSON.stringify(all));
  }catch(e){}
  clearArm = false;
  render();
}
